services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routerkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routerkit}
      POSTGRES_DB: ${POSTGRES_DB:-routerkit}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routerkit} -d ${POSTGRES_DB:-routerkit}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - routerkit-net

  bigcodebench-api:
    build: ./bigcodebench-api
    # No ports published to the host: only accessible from routerkit-api,
    # via the internal network, by design.
    networks:
      - routerkit-net
    restart: unless-stopped

  routerkit-api:
    build: ./routerkit-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-routerkit}:${POSTGRES_PASSWORD:-routerkit}@postgres:5432/${POSTGRES_DB:-routerkit}
      BIGCODEBENCH_API_URL: http://bigcodebench-api:8000
      ARTIFACTS_DIR: /data/artifacts
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      bigcodebench-api:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      # Bind mount (not a named volume): this way the user can see/edit
      # the files directly in ./data from their computer, without entering
      # the container. ./data/examples already has examples; the container
      # writes data/current and data/previous there too (see
      # app/services/snapshots.py).
      - ./data:/data/artifacts
    networks:
      - routerkit-net
    restart: unless-stopped

networks:
  routerkit-net:

volumes:
  pgdata:
